[files]
extend-exclude = [
    "src-tauri/src/territory_info.xml",
    "src/i18n/locales/*.json",
    # Vendored Python remote-tool reference (its Sphinx build output trips
    # false positives like "datas"/"odf"/"maintenant").
    "remote/",
    # Dependency names and SPDX expressions are generated verbatim.
    "src/generated/licenses.json",
    # Auto-generated from commit subjects by release.yml; typos here originate
    # in commit messages, which are immutable, so don't spell-check it.
    "CHANGELOG.md",
    # Internal project notes (daily logs + long-term memory). They are
    # append-only human notes that reference crate names (favored by typos as
    # e.g. "flate2"->"flate") and punycode/IDN tokens (e.g. "akss" inside
    # "xn--...akss.com"), so spell-checking them only generates noise.
    ".workbuddy/",
]

[default.extend-words]
# The IDN test fixtures in src-tauri/src/xray encode "cafe" as punycode
# ("xn--caf-dma") and as percent-escapes ("caf%C3%A9"). Both leave a bare "caf"
# token that is an encoding artefact, never a misspelling of "calf".
caf = "caf"
DBE = "DBE"
nd = "nd"
pn = "pn"
# `flate` is a token split out of the Rust crate name `flate2` (a GzDecoder
# dependency). typos wants to "correct" it to "flat" — a false positive, the
# crate name is intentional.
flate = "flate"
# `akss` appears only inside punycode/IDN domain aliases (e.g.
# "xn--74qz10cqsltibh40akss.com"). It is an encoding token, not a misspelling
# of "asks"/"ass". Listed here too because typos' files-exclude does NOT apply
# to file paths passed explicitly on the command line (as lint-staged does),
# so the identifier-level ignore is the reliable fix.
akss = "akss"

[default.extend-identifiers]
# Chrome Web Store extension name in the known-VPN list.
VeePN = "VeePN"
