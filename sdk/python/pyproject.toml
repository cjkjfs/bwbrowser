[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bwbrowser"
version = "0.1.0"
description = "Thin client for the BW Browser local REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
keywords = ["bw-browser", "browser-automation", "anti-detect", "cdp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
# No runtime dependencies on purpose: this client talks to a loopback server on
# the same machine, so the standard library is enough and installing the SDK can
# never drag a transitive dependency into an automation environment.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://bwbrowser.com"
Source = "https://github.com/zhom/bwbrowser"

[tool.hatch.build.targets.wheel]
packages = ["src/bwbrowser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
