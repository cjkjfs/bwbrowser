name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # 与 rolling-release 相同原因：ort CoreML 预编译包要求 macOS 14+ 部署目标
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ort_features: directml,cuda
            label: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            ort_features: coreml
            label: macos-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Setup Rust
        # nightly 浮动引用：2026-10-16 当天分发的 nightly 构建损坏（缺 unwind/proc_macro
        # rlib，三平台编译全挂）。钉到本地已完整验证（fmt+check+release build）的构建，
        # 上游恢复后可解除
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 #master
        with:
          toolchain: nightly-2026-10-16
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Verify frontend dist
        shell: bash
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found"
            ls -la dist 2>/dev/null || ls -la
            exit 1
          fi
          echo "Frontend dist OK"

      - name: Build sidecar binary
        shell: bash
        working-directory: ./src-tauri
        run: |
          cargo build --bin bwbrowser-proxy --target ${{ matrix.target }} --release --features sidecar
          echo "Sidecar build OK"

      - name: Copy sidecar binary (Windows)
        if: matrix.label == 'windows'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp src-tauri/target/${{ matrix.target }}/release/bwbrowser-proxy.exe src-tauri/binaries/bwbrowser-proxy-${{ matrix.target }}.exe
          echo "Sidecar copied OK"

      - name: Copy sidecar binary (macOS)
        if: matrix.label != 'windows'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp src-tauri/target/${{ matrix.target }}/release/bwbrowser-proxy src-tauri/binaries/bwbrowser-proxy-${{ matrix.target }}
          echo "Sidecar copied OK"

      - name: Download Xray sidecar
        run: node src-tauri/download-xray.mjs --target ${{ matrix.target }}

      - name: List binaries
        shell: bash
        run: |
          echo "=== Binaries directory ==="
          ls -la src-tauri/binaries/ || echo "No binaries dir"
          echo "=== dist directory ==="
          ls -la dist/ | head -5
          echo "=== Cargo.toml version ==="
          grep version src-tauri/tauri.conf.json | head -1

      - name: Load release notes
        id: notes
        shell: bash
        run: |
          if [ -f "release-notes.md" ]; then
            { echo "notes<<EOF"; cat release-notes.md; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "notes=See the assets to download this version and install." >> "$GITHUB_OUTPUT"
          fi

      # tauri-bundler 打包 NSIS 安装包时会从 GitHub 下载 nsis-3.13.zip，
      # 偶发 504 会把十几分钟的编译结果整个报废。这里预下载（带重试）并缓存，
      # bundler 检测到 makensis.exe 已存在就跳过下载。
      - name: Cache Tauri bundler tools (NSIS)
        if: matrix.label == 'windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-nsis-3.13-windows

      - name: Pre-fetch NSIS (retry on transient GitHub 5xx)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          # 布局与 tauri-bundler 的预期完全一致（crates/tauri-bundler nsis/mod.rs）：
          #   %LOCALAPPDATA%\tauri\NSIS\            <- nsis-3.13.zip 解压后重命名
          #   %LOCALAPPDATA%\tauri\NSIS\Plugins\x86-unicode\additional\nsis_tauri_utils.dll
          # REQUIRED_FILES 齐全时 bundler 跳过全部下载。
          $tauriDir = Join-Path $env:LOCALAPPDATA 'tauri'
          $dest = Join-Path $tauriDir 'NSIS'
          $makensis = Join-Path $dest 'makensis.exe'
          $dllPath = Join-Path $dest 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          if ((Test-Path $makensis) -and (Test-Path $dllPath)) {
            Write-Host "NSIS already cached, skip download"
            exit 0
          }

          function Get-WithRetry([string]$Url, [string]$OutFile, [int]$Attempts = 5) {
            foreach ($i in 1..$Attempts) {
              try {
                Write-Host "download attempt $i : $Url"
                Invoke-WebRequest -Uri $Url -OutFile $OutFile -MaximumRedirection 10
                return $true
              } catch {
                Write-Host "attempt $i failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (10 * $i)
              }
            }
            return $false
          }

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          if (-not (Test-Path $makensis)) {
            if (-not (Get-WithRetry 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' $zip)) {
              throw "Failed to download nsis-3.13.zip after retries"
            }
            $zipHash = (Get-FileHash -Algorithm SHA1 $zip).Hash
            if ($zipHash -ne 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E') {
              throw "nsis-3.13.zip SHA1 mismatch: $zipHash"
            }
            # bundler: 解压到 tauri 目录后把 nsis-3.13 重命名为 NSIS
            Expand-Archive -Path $zip -DestinationPath $tauriDir -Force
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            if (-not (Test-Path (Join-Path $tauriDir 'nsis-3.13'))) {
              throw "nsis-3.13 folder missing after extraction"
            }
            Rename-Item (Join-Path $tauriDir 'nsis-3.13') 'NSIS'
          }

          if (-not (Test-Path $dllPath)) {
            $dll = Join-Path $env:RUNNER_TEMP 'nsis_tauri_utils.dll'
            if (-not (Get-WithRetry 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' $dll)) {
              throw "Failed to download nsis_tauri_utils.dll after retries"
            }
            $dllHash = (Get-FileHash -Algorithm SHA1 $dll).Hash
            if ($dllHash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') {
              throw "nsis_tauri_utils.dll SHA1 mismatch: $dllHash"
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $dllPath) | Out-Null
            Copy-Item $dll $dllPath -Force
          }

          if (-not (Test-Path $makensis)) { throw "makensis.exe still missing after pre-fetch" }
          Write-Host "NSIS toolset ready: $dest"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        with:
          projectPath: ./src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "BW Browser ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --features ${{ matrix.ort_features }} --verbose

      - name: Create portable ZIP (Windows)
        if: matrix.label == 'windows'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PORTABLE_DIR="Bwbrowser-Portable"
          mkdir -p "$PORTABLE_DIR"

          cp "src-tauri/target/${{ matrix.target }}/release/bwbrowser.exe" "$PORTABLE_DIR/Bwbrowser.exe" || echo "main exe not found"
          cp "src-tauri/target/${{ matrix.target }}/release/bwbrowser-proxy.exe" "$PORTABLE_DIR/" || echo "proxy not found"
          cp "src-tauri/binaries/xray-${{ matrix.target }}.exe" "$PORTABLE_DIR/xray.exe" || echo "xray not found"

          mkdir -p "$PORTABLE_DIR/licenses"
          cp "src-tauri/binaries/xray-LICENSE.txt" "$PORTABLE_DIR/licenses/Xray-core-LICENSE.txt" || echo "license not found"

          touch "$PORTABLE_DIR/.portable"
          7z a "Bwbrowser_${VERSION}_x64-portable.zip" "$PORTABLE_DIR"

      - name: Upload portable ZIP (Windows)
        if: matrix.label == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release upload "$TAG" "Bwbrowser_${VERSION}_x64-portable.zip" --clobber
