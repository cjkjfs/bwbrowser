name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Verify frontend dist
        shell: bash
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found"
            ls -la dist 2>/dev/null || ls -la
            exit 1
          fi
          echo "Frontend dist OK"

      - name: Build sidecar binary
        shell: bash
        working-directory: ./src-tauri
        run: |
          cargo build --bin bwbrowser-proxy --target x86_64-pc-windows-msvc --release
          echo "Sidecar build OK"

      - name: Copy sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bwbrowser-proxy.exe src-tauri/binaries/bwbrowser-proxy-x86_64-pc-windows-msvc.exe
          echo "Sidecar copied OK"

      - name: Download Xray sidecar
        run: node src-tauri/download-xray.mjs --target x86_64-pc-windows-msvc

      - name: List binaries
        shell: bash
        run: |
          echo "=== Binaries directory ==="
          ls -la src-tauri/binaries/ || echo "No binaries dir"
          echo "=== dist directory ==="
          ls -la dist/ | head -5
          echo "=== Cargo.toml version ==="
          grep version src-tauri/tauri.conf.json | head -1

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "BW Browser ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc --verbose

      - name: Create portable ZIP
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PORTABLE_DIR="Bwbrowser-Portable"
          mkdir -p "$PORTABLE_DIR"

          cp "src-tauri/target/x86_64-pc-windows-msvc/release/bwbrowser.exe" "$PORTABLE_DIR/Bwbrowser.exe" || echo "main exe not found"
          cp "src-tauri/target/x86_64-pc-windows-msvc/release/bwbrowser-proxy.exe" "$PORTABLE_DIR/" || echo "proxy not found"
          cp "src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe" "$PORTABLE_DIR/xray.exe" || echo "xray not found"

          mkdir -p "$PORTABLE_DIR/licenses"
          cp "src-tauri/binaries/xray-LICENSE.txt" "$PORTABLE_DIR/licenses/" || echo "license not found"

          touch "$PORTABLE_DIR/.portable"
          7z a "Bwbrowser_${VERSION}_x64-portable.zip" "$PORTABLE_DIR"

      - name: Upload portable ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release upload "$TAG" "Bwbrowser_${VERSION}_x64-portable.zip" --clobber
