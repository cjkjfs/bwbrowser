# Installs Rust and checks formatting + linting

name: Lint Rust

on:
  workflow_call: {}
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths-ignore:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "README.md"
      - ".github/workflows/lint-js.yml"
      - ".github/workflows/osv.yml"
      - "next.config.js"
      - "tailwind.config.js"
      - "tsconfig.json"
      - "biome.json"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ort_features: coreml
          - os: ubuntu-24.04
            ort_features: ""
          - os: windows-latest
            ort_features: directml,cuda

    runs-on: ${{ matrix.os }}

    steps:
      - name: Disable git core.autocrlf on Windows
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false

      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up pnpm package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 #v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 #master
        with:
          # 2026-10-16 分发的 nightly 构建损坏；钉到本地完整验证过的构建
          # （相邻 nightly 的 rustfmt 规则有差异，日期化存档比 channel 晚一天）
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt install libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev openvpn unzip

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Get host target
        id: host_target
        shell: bash
        run: |
          HOST_TARGET=$(rustc -vV | sed -n 's|host: ||p')
          echo "target=${HOST_TARGET}" >> $GITHUB_OUTPUT
          echo "Host target: ${HOST_TARGET}"

      - name: Build sidecar binaries
        shell: bash
        working-directory: ./src-tauri
        run: |
          cargo build --bin bwbrowser-proxy --release --features sidecar

      - name: Copy sidecar binaries to Tauri binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          HOST_TARGET="${{ steps.host_target.outputs.target }}"
          if [[ "$HOST_TARGET" == *"windows"* ]]; then
            cp src-tauri/target/release/bwbrowser-proxy.exe src-tauri/binaries/bwbrowser-proxy-${HOST_TARGET}.exe
          else
            cp src-tauri/target/release/bwbrowser-proxy src-tauri/binaries/bwbrowser-proxy-${HOST_TARGET}
            chmod +x src-tauri/binaries/bwbrowser-proxy-${HOST_TARGET}
          fi

      - name: Download verified Xray-core sidecar
        run: node src-tauri/download-xray.mjs --target ${{ steps.host_target.outputs.target }}

      - name: Run rustfmt check
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Run clippy check and deny warnings
        shell: bash
        run: |
          FEATURES="${{ matrix.ort_features }}"
          if [ -n "$FEATURES" ]; then
            cargo clippy --all-targets --features "$FEATURES" -- -D warnings -D clippy::all
          else
            cargo clippy --all-targets -- -D warnings -D clippy::all
          fi
        working-directory: src-tauri

      - name: Run test suite
        run: pnpm test

      - name: Run cargo audit security check
        run: cargo audit
        working-directory: src-tauri
