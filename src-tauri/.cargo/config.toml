[build]
# Omit jobs setting to use all cores

incremental = true

# ort 的 CoreML 预编译包引用 ___isPlatformVersionAtLeast，需要 macOS 14+ SDK。
# 注意：-mmacosx-version-min 不能用——rustc 默认基线（11.0）会先传给 cc，ld 取
# 第一个出现的版本参数，追加的 link-arg 被忽略（CI 实测）。ld64 的
# -platform_version 显式覆盖平台版本且优先级更高，对旧 ld 也向后兼容。
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-platform_version,macOS,14.0,14.0"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-platform_version,macOS,14.0,14.0"]

# tauri-action 子进程链会丢失 workflow env（#97/#98 日志证明 rustc 基线仍是
# 11.0 → 链接命令第一个 -mmacosx-version-min=11.0.0 赢）。cargo 的 [env] 段
# 对构建进程强制注入，rustc 1.72+ 读 MACOSX_DEPLOYMENT_TARGET 调整 Apple 基线。
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"
